<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Firefox Audio Bridge</title>


    <style>

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #111827;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        .container {

            width: min(500px, 90vw);

            padding: 35px;

            background: #1f2937;

            border-radius: 16px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.35);

            text-align: center;

        }


        h1 {

            margin-top: 0;

        }


        button {

            width: 100%;

            padding: 15px;

            margin-top: 20px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            cursor: pointer;

        }


        button:hover {

            background: #1d4ed8;

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        #status {

            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            background: #111827;

            font-size: 14px;

        }


        audio {

            width: 100%;

            margin-top: 20px;

        }

    </style>

</head>


<body>


<div class="container">

    <h1>🎧 Firefox Audio</h1>

    <p>
        Audio from your Kasm Firefox workspace
    </p>


    <button id="start">
        Start Audio
    </button>


    <audio
        id="audio"
        controls
    ></audio>


    <div id="status">
        Waiting for audio...
    </div>

</div>


<script>

const button =
    document.getElementById("start");

const audio =
    document.getElementById("audio");

const status =
    document.getElementById("status");


button.addEventListener(
    "click",
    async () => {

        button.disabled = true;

        status.textContent =
            "Connecting to Firefox audio...";


        try {

            audio.src =
                `/stream?timestamp=${Date.now()}`;

            await audio.play();


            status.textContent =
                "🔊 Firefox audio is playing";

        }

        catch (error) {

            console.error(error);

            status.textContent =
                "❌ Unable to start audio";

            button.disabled = false;

        }

    }
);


audio.addEventListener(
    "playing",
    () => {

        status.textContent =
            "🔊 Firefox audio is playing";

    }
);


audio.addEventListener(
    "waiting",
    () => {

        status.textContent =
            "⏳ Buffering audio...";

    }
);


audio.addEventListener(
    "error",
    () => {

        status.textContent =
            "❌ Audio stream error";

        button.disabled = false;

    }
);

</script>


</body>

</html>
