services:
  firefox:
    image: kasmweb/firefox:1.17.0
    container_name: workspace_firefox
    restart: unless-stopped

    ports:
      - "6901:6901"
      - "4901:4901"

    environment:
      DISABLE_AUTH: "true"
      VNC_PW: "SecurePassword123!"
      VNC_RESOLUTION: "1920x1080"

      MAX_FRAME_RATE: "60"

      START_PULSEAUDIO: "1"
      KASM_SVC_AUDIO: "1"

    shm_size: "4gb"

    security_opt:
      - seccomp:unconfined

    network_mode: bridge

  audio-bridge:
    build:
      context: ./audio-bridge

    container_name: firefox_audio_bridge
    restart: unless-stopped

    ports:
      - "7000:7000"

    environment:
      PORT: "7000"
      KASM_HOST: "host.docker.internal"
      KASM_AUDIO_PORT: "4901"
      KASM_USER: "kasm_user"
      KASM_PASSWORD: "SecurePassword123!"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    network_mode: bridge