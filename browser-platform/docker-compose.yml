services:
  redis:
    image: redis:7-alpine
    container_name: redis

    ports:
      - "6379:6379"

    networks:
      - backend

  session-service:
    build:
      context: ./session-service

    container_name: session-service

    ports:
      - "3000:3000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      - redis

    networks:
      - backend

networks:
  backend:
    driver: bridge