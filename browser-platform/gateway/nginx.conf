events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream session_service { server session-service:3000; }
    upstream browser_proxy { server browser-proxy:3001; }
    upstream frontend { server browser-frontend:80; }

    # Main dashboard and API.
    server {
        listen 80;
        server_name localhost 127.0.0.1 _;

        location /api/ {
            proxy_pass http://session_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }

    # Per-session hostnames preserve Kasm's root-relative asset and websocket paths.
    server {
        listen 80;
        server_name ~^[0-9a-fA-F-]+\.localhost$;

        location / {
            proxy_pass http://browser_proxy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}